<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook广告费充值面板</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <style>
        .loading-spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3498db;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <div class="bg-white rounded-lg shadow-lg p-6">
            <div class="flex items-center justify-between mb-6">
                <h1 class="text-3xl font-bold text-gray-800 flex items-center">
                    <i data-lucide="credit-card" class="w-8 h-8 mr-3 text-blue-600"></i>
                    Facebook广告费充值面板
                </h1>
                <button id="refreshBtn" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg flex items-center">
                    <i data-lucide="refresh-cw" class="w-4 h-4 mr-2"></i>
                    刷新账户
                </button>
            </div>

            <div class="mb-6">
                <div class="relative">
                    <i data-lucide="search" class="absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400 w-5 h-5"></i>
                    <input 
                        type="text" 
                        id="searchInput" 
                        placeholder="搜索广告账户ID (例如: act_123456789)" 
                        class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                    >
                </div>
            </div>

            <div id="loadingSection" class="text-center py-8">
                <div class="loading-spinner mx-auto mb-4"></div>
                <p class="text-gray-600">正在加载广告账户数据...</p>
            </div>

            <div id="errorSection" class="hidden bg-red-50 border border-red-200 rounded-lg p-4 mb-6">
                <div class="flex items-center">
                    <i data-lucide="alert-circle" class="w-5 h-5 text-red-500 mr-2"></i>
                    <span class="text-red-700" id="errorMessage"></span>
                </div>
            </div>

            <div id="accountsSection" class="hidden">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-xl font-semibold text-gray-800">广告账户列表</h2>
                    <span id="accountCount" class="text-sm text-gray-600"></span>
                </div>

                <div class="overflow-x-auto">
                    <table class="w-full border-collapse bg-white">
                        <thead>
                            <tr class="bg-gray-50">
                                <th class="border border-gray-200 px-4 py-3 text-left font-semibold text-gray-700">账户ID</th>
                                <th class="border border-gray-200 px-4 py-3 text-left font-semibold text-gray-700">账户名称</th>
                                <th class="border border-gray-200 px-4 py-3 text-left font-semibold text-gray-700">余额</th>
                                <th class="border border-gray-200 px-4 py-3 text-left font-semibold text-gray-700">限额</th>
                                <th class="border border-gray-200 px-4 py-3 text-left font-semibold text-gray-700">状态</th>
                                <th class="border border-gray-200 px-4 py-3 text-center font-semibold text-gray-700">操作</th>
                            </tr>
                        </thead>
                        <tbody id="accountsTableBody">
                        </tbody>
                    </table>
                </div>

                <div id="noResultsMessage" class="hidden text-center py-8 text-gray-500">
                    <i data-lucide="search-x" class="w-12 h-12 mx-auto mb-2 text-gray-400"></i>
                    <p>没有找到匹配的广告账户</p>
                </div>
            </div>
        </div>
    </div>

    <div id="rechargeModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white rounded-lg p-6 w-96 max-w-90vw">
            <h3 class="text-lg font-semibold mb-4">账户充值</h3>
            <p class="text-gray-600 mb-4">为账户 <span id="modalAccountId" class="font-mono font-semibold"></span> 充值</p>
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-2">充值金额 (USD)</label>
                <input 
                    type="number" 
                    id="rechargeAmount" 
                    placeholder="输入充值金额" 
                    min="1" 
                    max="1000"
                    class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                >
            </div>
            <div class="flex justify-end space-x-3">
                <button id="cancelRecharge" class="px-4 py-2 text-gray-600 hover:text-gray-800">取消</button>
                <button id="confirmRecharge" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg flex items-center">
                    <i data-lucide="zap" class="w-4 h-4 mr-2"></i>
                    确认充值
                </button>
            </div>
        </div>
    </div>

    <script src="/static/js/main.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
